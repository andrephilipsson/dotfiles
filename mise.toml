"brew:tmux" = "latest"
"brew:tree" = "latest"
"brew:yt-dlp" = "latest"
"brew:zsh" = "latest"
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-history-substring-search" = "latest"
"brew:zsh-syntax-highlighting" = "latest"

"brew-cask:1password" = "latest"
